<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bé nghe từ mới</title>
<script src="../tro_choi/chung/am.js"></script>
<link rel="icon" href="data:,">
<style>
/* Trang ba mẹ mở bằng điện thoại (quét mã QR trên thẻ mang về nhà): chạm hình để nghe từ */
:root { --ink: #1F2D4A; --soft: #56637F; --teal: #14998F; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #EAF4F8; color: var(--ink); font-family: system-ui, 'Segoe UI', Arial, sans-serif; }
header { background: #fff; padding: 16px; text-align: center; box-shadow: 0 3px 0 rgba(31, 45, 74, .08); }
h1 { margin: 0; font-size: 24px; } header p { margin: 6px 0 0; color: var(--soft); font-size: 15px; }
main { max-width: 640px; margin: 0 auto; padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
button.w { background: #fff; border: 0; border-radius: 18px; padding: 12px; box-shadow: 0 4px 0 rgba(31, 45, 74, .12); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 24px; font-weight: 800; color: var(--ink); cursor: pointer; }
button.w img { height: 96px; max-width: 100%; object-fit: contain; }
button.w:active { transform: scale(.97); }
.cau { grid-column: 1 / -1; background: #fff; border-radius: 18px; padding: 14px; text-align: center; font-size: 20px; }
.cau button { margin-top: 8px; font-size: 18px; border: 0; border-radius: 12px; padding: 10px 16px; background: var(--teal); color: #fff; font-weight: 800; }
footer { text-align: center; color: var(--soft); font-size: 13px; padding: 10px 16px 30px; }
</style>
</head>
<body>
<header><h1 id="tt">Bé nghe từ mới</h1><p>Chạm vào hình để nghe từ và câu. Ba mẹ cùng bé nói theo nhé!</p><p id="noVoice" hidden style="color:#B5463B">Điện thoại chưa có giọng đọc tiếng Anh nên có thể đọc sai. Ba mẹ thử mở bằng Chrome hoặc Safari.</p></header>
<main id="m"></main>
<footer>Quần đảo Song Kim · Lớp học cô Anh</footer>
<script src="../tro_choi/chung/kho_tu.js"></script>
<script src="../tro_choi/chung/cau_mau.js"></script>
<script>
const QS = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const BASE = new URL('../tro_choi/goi_do_choi/', location.href);
const words = (QS.get('w') || '').split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
const unit = QS.get('u') || '';
if (QS.get('u')) $('tt').textContent = QS.get('u');
function say(t, then) { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; const v = speechSynthesis.getVoices().find(x => /^en/i.test(x.lang)); if (v) u.voice = v; u.rate = .8; if (then) u.onend = then; speechSynthesis.speak(u); }
const list = words.map(w => (window.KHO_TU || []).find(W => W.w.toLowerCase() === w) || { w, img: '' });
$('m').innerHTML = list.map((W, i) => `<button class="w" data-i="${i}">${W.img ? `<img src="${/^data:/.test(W.img) ? W.img : new URL(W.img, BASE).href}" alt="">` : ''}${esc(W.w)}</button>`).join('')
  + `<div class="cau" id="cauBox" hidden></div>`;
document.querySelectorAll('button.w').forEach(b => b.onclick = () => { const W = list[+b.dataset.i], S = window.CauMau && CauMau.of(W.w, unit); $('cauBox').hidden = !S; if (S) $('cauBox').innerHTML = `<b>${esc(S.q)}</b><br>${esc(S.a)}`; say(W.w, S ? () => setTimeout(() => say(S.q + ' ' + S.a), 400) : null); });
setTimeout(() => { if (window.speechSynthesis && !speechSynthesis.getVoices().some(v => /^en/i.test(v.lang))) $('noVoice').hidden = false; }, 1500);
</script>
</body>
</html>
